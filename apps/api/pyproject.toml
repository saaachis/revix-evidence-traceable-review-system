[project]
name = "revix-api"
version = "0.1.0"
description = "Read-only, contract-first serving layer"
requires-python = ">=3.12"
dependencies = [
    "revix-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revix_api"]
