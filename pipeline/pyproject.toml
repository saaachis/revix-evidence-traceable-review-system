[project]
name = "revix-pipeline"
version = "0.1.0"
description = "Ingestion connectors and the nightly enrichment stages"
requires-python = ">=3.12"
dependencies = [
    "revix-core",
    "typer>=0.15",
    "httpx>=0.28",
    "tenacity>=9.0",
    "selectolax>=0.3.27",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
# Training and evaluating the aspect classifier. Optional on purpose: the API
# image installs the workspace without extras, so scikit-learn and numpy stay
# out of the container that only ever serves rows. The nightly workflow asks
# for them explicitly.
ml = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.scripts]
revix = "revix_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revix_pipeline"]
