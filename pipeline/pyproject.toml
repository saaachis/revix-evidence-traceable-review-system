[project]
name = "revix-pipeline"
version = "0.1.0"
description = "Ingestion connectors and the nightly enrichment stages"
requires-python = ">=3.12"
dependencies = [
    "revix-core",
    "typer>=0.15",
    "httpx>=0.28",
    "tenacity>=9.0",
    "selectolax>=0.3.27",
    "python-dateutil>=2.9",
]

[project.scripts]
revix = "revix_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revix_pipeline"]
