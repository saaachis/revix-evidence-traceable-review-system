name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|development|production)$|\.pem$|\.p12$|service-account.*\.json$'; then
            echo "::error::A secret-bearing file is tracked. Remove it and rotate the credential."
            exit 1
          fi
          echo "No secret-bearing files tracked."

      - name: No raw scraped payloads
        run: |
          if git ls-files | grep -E '^data/(raw|cache|interim)/'; then
            echo "::error::Raw payloads must not be committed."
            exit 1
          fi
          echo "No raw payloads tracked."

      - name: Internal documentation links resolve
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#:]+\.md(#[^)]*)?\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | while read -r link; do
                  [ -z "$link" ] && continue
                  case "$link" in /*) target=".$link" ;; *) target="$dir/$link" ;; esac
                  if [ ! -f "$target" ]; then
                    echo "::error file=$file::broken link -> $link"
                    exit 1
                  fi
                done || status=1
          done < <(git ls-files '*.md')
          exit $status

  api:
    name: API and pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: |
          if [ -f apps/api/pyproject.toml ] || [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python project yet — skipping. Lands in week 1."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check .

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No web project yet — skipping. Lands in week 1."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint --if-present

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build --if-present
