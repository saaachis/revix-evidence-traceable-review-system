name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI talks to the service container on the standard port. Locally the
  # compose file uses 5433 so it cannot collide with a host Postgres.
  DATABASE_URL: postgresql+psycopg://revix:revix@localhost:5432/revix

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|development|production)$|\.pem$|\.p12$|service-account.*\.json$'; then
            echo "::error::A secret-bearing file is tracked. Remove it and rotate the credential."
            exit 1
          fi
          echo "No secret-bearing files tracked."

      - name: No raw scraped payloads
        run: |
          if git ls-files | grep -E '^data/(raw|cache|interim)/'; then
            echo "::error::Raw payloads must not be committed."
            exit 1
          fi
          echo "No raw payloads tracked."

      - name: Internal documentation links resolve
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#:]+\.md(#[^)]*)?\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | while read -r link; do
                  [ -z "$link" ] && continue
                  case "$link" in /*) target=".$link" ;; *) target="$dir/$link" ;; esac
                  if [ ! -f "$target" ]; then
                    echo "::error file=$file::broken link -> $link"
                    exit 1
                  fi
                done || status=1
          done < <(git ls-files '*.md')
          exit $status

  python:
    name: API and pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml, so CI and a developer's machine
        # cannot disagree about what the database supports.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: revix
          POSTGRES_PASSWORD: revix
          POSTGRES_DB: revix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revix -d revix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy packages/revix_core/src pipeline/src apps/api/src

      - name: Migrations apply
        run: uv run alembic upgrade head

      # The check that catches the mistake everybody makes: editing a model and
      # forgetting the migration. If they disagree, this fails.
      - name: Migrations match the models
        run: uv run alembic check

      # A migration that cannot be reversed is a migration you cannot recover
      # from. This caught two real bugs the first time it ran.
      - name: Migrations reverse cleanly
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Reference data seeds, and seeds idempotently
        run: |
          uv run revix db seed-reference
          out=$(uv run revix db seed-reference)
          echo "$out"
          echo "$out" | grep -q "already present" || {
            echo "::error::seed-reference is not idempotent"; exit 1; }

      # The whole pipeline against fixtures, on every push. This is the check
      # that would have caught the resolver scoring bug and the Kish bug, both
      # of which passed unit tests while producing nonsense end to end.
      - name: Pipeline runs end to end
        run: |
          uv run revix pipeline nightly --limit 6 --sources fixture_owner,fixture_forum,fixture_expert
          uv run revix db status

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  web:
    name: Web
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: revix
          POSTGRES_PASSWORD: revix
          POSTGRES_DB: revix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revix -d revix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          uv sync --all-packages --frozen
          npm ci --prefix apps/web

      # The typed client is generated from the OpenAPI schema, so this catches
      # the frontend and the serving layer drifting apart. If someone changes a
      # response shape without regenerating, the committed types differ and
      # this fails rather than the page breaking at runtime.
      - name: The committed API types match the API
        run: |
          uv run python -c "import json;from revix_api.main import app;print(json.dumps(app.openapi(),indent=2))" > apps/web/openapi.json
          npx --prefix apps/web openapi-typescript apps/web/openapi.json -o /tmp/api-types.ts
          if ! diff -q /tmp/api-types.ts apps/web/src/lib/api-types.ts >/dev/null; then
            echo "::error::apps/web/src/lib/api-types.ts is stale. Run: npm run openapi"
            diff /tmp/api-types.ts apps/web/src/lib/api-types.ts | head -40
            exit 1
          fi
          echo "Frontend types match the contract."

      - name: Lint
        run: npm run lint --prefix apps/web

      - name: Types
        run: npm run typecheck --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web

      # The whole product, driven in a real browser. The test that matters is
      # the weighting switch: if flipping it stopped changing the numbers, the
      # project would have no point, and that is not something a unit test on a
      # reducer would catch.
      - name: Browser smoke test
        env:
          DATABASE_URL: postgresql+psycopg://revix:revix@localhost:5432/revix
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          uv run alembic upgrade head
          uv run revix pipeline nightly --limit 8 --sources fixture_owner,fixture_forum,fixture_expert
          uv run uvicorn revix_api.main:app --port 8000 &
          npm run start --prefix apps/web -- --port 3000 &
          # http-get:// rather than http://, because wait-on probes with HEAD
          # by default and a GET-only FastAPI route correctly answers 405.
          npx --prefix apps/web wait-on http-get://127.0.0.1:8000/health http-get://127.0.0.1:3000 -t 90000
          npm run e2e --prefix apps/web

      # Automated accessibility checks catch perhaps a third of real problems,
      # so passing this is a floor rather than a certificate. It is here
      # because the failure it caught was invisible by eye: text dimmed with
      # opacity-65 sat at 2.5:1, and the rows it made hardest to read were the
      # ones saying we do not have enough evidence.
      - name: Accessibility
        # Its own env block. A step does not inherit the previous step's, so
        # without CHROME_PATH this falls back to the Windows default and
        # cannot find a browser on the runner. The servers from the step above
        # are still running; those are processes, not environment.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run a11y --prefix apps/web

  image:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deployed API is this image, so a Dockerfile that no longer builds
      # is a broken deploy waiting to happen. Catching it here costs ninety
      # seconds; catching it at deploy time costs an afternoon, and typically
      # the afternoon before a demo.
      - name: Build
        run: docker build -f apps/api/Dockerfile -t revix-api:ci .

      # It starting is not the same as it working. Without a database it must
      # still answer 503 with a structured body rather than 500 with a
      # SQLAlchemy stack trace. That is what a platform health check sees
      # during a rollout, and it is the difference between "not ready yet"
      # and "this deploy is broken".
      - name: It reports a missing database instead of crashing
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL="postgresql+psycopg://nobody:nobody@127.0.0.1:1/none" \
            revix-api:ci
          for i in $(seq 1 30); do
            # `|| code=000` rather than `|| echo 000`, because curl prints
            # the code itself and both would land in one substitution.
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 http://127.0.0.1:8000/health) || code=000
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "status $code"
          cat /tmp/health.json || true
          docker logs api 2>&1 | tail -20
          test "$code" = "503"
          grep -q '"database":false' /tmp/health.json

      - name: It shuts down on a signal
        run: |
          # Ten seconds is Docker's kill timeout. Taking that long means the
          # process never saw SIGTERM, which is what a shell-form CMD does.
          start=$(date +%s)
          docker stop api >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 8
