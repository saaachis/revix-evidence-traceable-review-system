name: Nightly pipeline

# The orchestrator, such as it is. Every enrichment stage is idempotent, so
# "recovery" is running this again rather than resuming from a checkpoint.
# See docs/adr/0002 for why this is not Prefect.

on:
  schedule:
    # 04:00 IST. Late enough that the day's reviews have landed, early enough
    # that a failure can be fixed before anyone looks at the site.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys"
        default: "carwale,cardekho,youtube"

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    # The catalogue went from 16 models to 42, and ingest cost scales with
    # models: CarWale alone is eight pages for each of twenty-five cars at a
    # deliberate ten requests a minute. The last 16-model run took 19 minutes,
    # so 45 was no longer a ceiling with room in it, it was a coin flip.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-packages --frozen

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # The real sources, deliberately. This default is what the 04:00
          # schedule runs with, and while it named the development fixtures a
          # single scheduled run would have quietly poured 3,784 generated
          # reviews back into a database we had just cleaned out.
          uv run revix pipeline nightly \
            --sources "${{ inputs.sources || 'carwale,cardekho,youtube' }}"

      - name: Report what exists afterwards
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run revix db status
