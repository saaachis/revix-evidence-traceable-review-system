[project]
name = "revix"
version = "0.1.0"
description = "An evidence-traceable review system for Indian cars and two-wheelers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "revix-core",
    "revix-pipeline",
    "revix-api",
]

# The three packages depend on each other in one direction only:
#
#   revix-api ──┐
#               ├──> revix-core   (models, settings, session)
#   revix-pipeline ─┘
#
# revix-core never imports from the other two. That rule is what keeps the
# read path and the write path from tangling, and it is enforced by import
# linting in CI rather than by convention.
[tool.uv.workspace]
members = ["packages/revix_core", "pipeline", "apps/api"]

[tool.uv.sources]
revix-core = { workspace = true }
revix-pipeline = { workspace = true }
revix-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
    "httpx>=0.28",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # The code-review toolkit. Radon scores the code itself: cyclomatic
    # complexity, a maintainability index, raw line counts and Halstead
    # volume. Xenon turns those scores into a build gate, so the grade cannot
    # quietly slide between one review and the next.
    #
    # Bandit is static security analysis over our own source, and pip-audit
    # checks the dependency tree against the published advisory database. Both
    # are gated in CI: a medium-or-higher Bandit finding or a known-vulnerable
    # dependency fails the build rather than waiting to be noticed.
    #
    # Mutmut is mutation testing: it changes the code on purpose and asks
    # whether a test notices. It has no native Windows support and tells you to
    # use WSL, and all three of us develop on Windows, so it does not run in
    # the local loop. CI runs on Linux, which is where it belongs, scoped to
    # the quota ledger and reported rather than gated (see .github/workflows).
    "radon>=6.0",
    "xenon>=0.9",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "mutmut>=3.8.0",
]

# ----------------------------------------------------------------------------
# ruff: linting and formatting. One tool instead of black + isort + flake8.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/ holds one-off operational scripts that are not part of the
# application and are not worth reformatting.
extend-exclude = ["db/migrations/versions", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8 naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes, which matters for collected_at
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQLAlchemy's declarative API requires __table_args__ and type_annotation_map
# to be plain class-level dicts. Annotating them ClassVar breaks its
# introspection, so RUF012 does not apply to model definitions.
"packages/revix_core/src/revix_core/models/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
# Our own packages are first party, otherwise they get sorted in among the
# third-party imports and every file churns on the next format run.
known-first-party = ["revix_core", "revix_pipeline", "revix_api"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------
# mypy: typed where it earns its keep. Strict on core, relaxed on tests.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["db/migrations/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "pgvector.*", "rapidfuzz.*", "sentence_transformers.*", "sklearn.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "db: requires a live PostgreSQL instance",
    "network: touches the public internet, skipped in CI by default",
]

[tool.coverage.run]
branch = true
source = ["packages/revix_core/src", "pipeline/src", "apps/api/src"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ----------------------------------------------------------------------------
# mutmut: mutation testing, Linux/CI only (see the dev group note above).
#
# Scoped to the quota ledger on purpose. It is small, pure, and already has a
# focused test (tests/test_quota.py), so the surviving-mutant count is a real
# statement about those assertions rather than a days-long run nobody reads.
# ----------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = ["pipeline/src/revix_pipeline/connectors/quota.py"]

# ----------------------------------------------------------------------------
# bandit: static security analysis. Run over our own source in CI, gated at
# medium severity. Tests are not scanned; assert statements there are the
# point, not a finding.
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
